name: BioNose-Edge CI & QA Gateway

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    name: Code Formatting & Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  nostd-verification:
    name: Embedded #![no_std] Hardware Cross-Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imc-unknown-none-elf

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify bionose-core compiles in pure no_std (native)
        run: cargo check -p bionose-core --no-default-features

      - name: Cross-compile for ARM Cortex-M4/M7 (thumbv7em-none-eabihf)
        run: cargo check -p bionose-core --no-default-features --target thumbv7em-none-eabihf

      - name: Cross-compile for RISC-V / ESP32 (riscv32imc-unknown-none-elf)
        run: cargo check -p bionose-core --no-default-features --target riscv32imc-unknown-none-elf

      - name: Verify crates.io package readiness
        run: cargo package -p bionose-core --no-verify

  test-suite:
    name: Unit, Integration & Adversarial Stress Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run all workspace tests (core, cli, adversarial)
        run: cargo test --all --verbose

      - name: Run adversarial fault injection & stress tests
        run: cargo test -p bionose-core --test adversarial_stress_tests --verbose

  security-audit:
    name: License & Vulnerability Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml
