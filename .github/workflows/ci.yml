name: BioNose-Edge CI & QA Gateway

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-lint:
    name: Code Formatting & Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  nostd-verification:
    name: Embedded #![no_std] Hardware Cross-Compilation Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            thumbv6m-none-eabi,
            thumbv7m-none-eabi,
            thumbv7em-none-eabi,
            thumbv7em-none-eabihf,
            thumbv8m.main-none-eabihf,
            riscv32imc-unknown-none-elf,
            riscv32imac-unknown-none-elf

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify bionose-core compiles in pure no_std (native)
        run: cargo check -p bionose-core --no-default-features

      - name: Cross-compile ARM Cortex-M0/M0+ / RP2040 (thumbv6m-none-eabi)
        run: cargo check -p bionose-core --no-default-features --target thumbv6m-none-eabi

      - name: Cross-compile ARM Cortex-M3 / STM32F1 (thumbv7m-none-eabi)
        run: cargo check -p bionose-core --no-default-features --target thumbv7m-none-eabi

      - name: Cross-compile ARM Cortex-M4/M7 soft-float (thumbv7em-none-eabi)
        run: cargo check -p bionose-core --no-default-features --target thumbv7em-none-eabi

      - name: Cross-compile ARM Cortex-M4F/M7F hard-float (thumbv7em-none-eabihf)
        run: cargo check -p bionose-core --no-default-features --target thumbv7em-none-eabihf

      - name: Cross-compile ARM Cortex-M33 hard-float (thumbv8m.main-none-eabihf)
        run: cargo check -p bionose-core --no-default-features --target thumbv8m.main-none-eabihf

      - name: Cross-compile RISC-V RV32IMC / ESP32-C3 / CH32V (riscv32imc-unknown-none-elf)
        run: cargo check -p bionose-core --no-default-features --target riscv32imc-unknown-none-elf

      - name: Cross-compile RISC-V RV32IMAC / ESP32-C6 / ESP32-H2 (riscv32imac-unknown-none-elf)
        run: cargo check -p bionose-core --no-default-features --target riscv32imac-unknown-none-elf

      - name: Verify crates.io package readiness with full validation
        run: cargo package -p bionose-core

  test-suite:
    name: Unit, Integration & Adversarial Stress Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run all workspace tests (core, cli, adversarial)
        run: cargo test --all --verbose

      - name: Run adversarial fault injection & stress tests
        run: cargo test -p bionose-core --test adversarial_stress_tests --verbose

  security-audit:
    name: License & Vulnerability Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml
