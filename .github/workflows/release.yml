name: BioNose-Edge Binary Release & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: bionose-cli
            archive_name: bionose-cli-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: bionose-cli.exe
            archive_name: bionose-cli-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: bionose-cli
            archive_name: bionose-cli-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: bionose-cli
            archive_name: bionose-cli-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build optimized release binary
        run: cargo build --release --target ${{ matrix.target }} -p bionose-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}
          cd ../../..
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}
          cd ../../..
          certutil -hashfile ${{ matrix.archive_name }} SHA256 | grep -v "hash" | grep -v "CertUtil" | tr -d ' \r\n' > ${{ matrix.archive_name }}.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-github-release:
    name: Publish GitHub Release & Release Notes
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
